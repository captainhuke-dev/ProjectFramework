name: TASK058 temporary consolidation

on:
  push:
    branches:
      - task058-framework120
    paths:
      - .github/workflows/task058-consolidate.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: task058-framework120
          fetch-depth: 0

      - name: Apply bounded TASK-058 patches
        run: python docs/superpowers/tools/task058_patch.py

      - name: Normalize changed text EOFs
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          names = subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines()
          for name in names:
              p = Path(name)
              if p.is_file() and p.suffix in {'.md', '.yaml', '.yml'}:
                  text = p.read_text(encoding='utf-8')
                  p.write_text(text.rstrip() + '\n', encoding='utf-8', newline='\n')
          print('TASK058_EOF_NORMALIZE PASS')
          PY

      - name: Verify diff hygiene and no runtime/code artifacts
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          names = subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines()
          forbidden = [p for p in names if not (p.endswith('.md') or p.endswith('.yaml') or p.endswith('.yml'))]
          if forbidden:
              raise SystemExit(f'forbidden non-doc/config artifacts: {forbidden}')
          print('TASK058_PATCH_SCOPE PASS', len(names), 'files')
          PY

      - name: Commit and push consolidated surfaces
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(task058): consolidate Framework 1.20 current surfaces [skip ci]"
          git push origin HEAD:task058-framework120
