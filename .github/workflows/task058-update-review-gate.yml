name: TASK058 temporary review-gate ledger update

on:
  push:
    branches:
      - task058-framework120
    paths:
      - .github/workflows/task058-update-review-gate.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task058-framework120
          fetch-depth: 0
      - name: Update exact TASK-058 review gate truth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/PROJECT-TASKS.md')
          text = p.read_text(encoding='utf-8')
          old_readiness = '- **readiness:** `WRITTEN_SPEC_APPROVED / IMPLEMENTATION_PLAN_SELF_REVIEWED / EXECUTION_IN_PROGRESS / CANDIDATE_NOT_FROZEN`'
          new_readiness = '- **readiness:** `IMPLEMENTATION_COMPLETE / STRUCTURAL_PASS / AFFECTED_PASS / INDEPENDENT_REVIEW_PENDING / CANDIDATE_NOT_FROZEN`'
          assert text.count(old_readiness) == 1, text.count(old_readiness)
          text = text.replace(old_readiness, new_readiness, 1)
          anchor = '- **Plan State:** `WRITTEN / SELF_REVIEWED / EXECUTION_AUTHORIZED`.\n'
          addition = ('- **Verification Progress:** `TASK058_STRUCTURAL 176/176 PASS; TASK058_AFFECTED 176/176 PASS` — GitHub Actions run `35058260079`; '
                      'pre-review evidence `docs/superpowers/evidence/2026-09-16-task058-pre-review-verification.md`.\n'
                      '- **Review State:** `INDEPENDENT_REVIEW_PENDING`; candidate freeze and RELEASE_FULL are prohibited until Critical=0 and Important=0 unresolved.\n')
          assert text.count(anchor) == 1, text.count(anchor)
          text = text.replace(anchor, anchor + addition, 1)
          old_next = '- **Exact Next Step:** Complete canonical Framework 1.20 propagation/verification on `task058-framework120`; then independent review → candidate freeze → one final `RELEASE_FULL`. AI-ControlTower runtime remains out of scope.'
          new_next = '- **Exact Next Step:** Run independent fresh-context acceptance review against the exact `task058-framework120` implementation head; resolve any Critical/Important findings and rerun AFFECTED if normative content changes; only then freeze candidate and run one final `RELEASE_FULL`. AI-ControlTower runtime remains out of scope.'
          assert text.count(old_next) == 1, text.count(old_next)
          text = text.replace(old_next, new_next, 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Commit review-gate truth
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/PROJECT-TASKS.md
          git commit -m "docs(task058): record affected pass and review gate [skip ci]"
          git push origin HEAD:task058-framework120
