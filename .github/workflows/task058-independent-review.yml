name: TASK058 independent fresh-context review

on:
  push:
    branches:
      - task058-review-runner
    paths:
      - .github/workflows/task058-independent-review.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact implementation review target
        uses: actions/checkout@v4
        with:
          ref: eadf7a63f6cb1057f982491edc889fe0e7cf3086
          fetch-depth: 0
          path: target

      - name: Checkout reviewer prompt data
        uses: actions/checkout@v4
        with:
          ref: task058-review-runner
          fetch-depth: 1
          path: runner

      - name: Build exact review package
        shell: bash
        run: |
          cd target
          git diff --no-ext-diff --unified=3 f81992064d49c1f50f80c790667ec5be9b9ada0f..eadf7a63f6cb1057f982491edc889fe0e7cf3086 > /tmp/task058.diff
          python - <<'PY'
          from pathlib import Path
          header = Path('../runner/.github/task058-independent-review-prompt.txt').read_text(encoding='utf-8')
          spec = Path('docs/superpowers/specs/2026-09-16-task058-deterministic-execution-runtime-contract-design.md').read_text(encoding='utf-8')
          diff = Path('/tmp/task058.diff').read_text(encoding='utf-8')
          prompt = header + '\n\n=== APPROVED WRITTEN SPEC ===\n' + spec + '\n\n=== EXACT BASE-TO-TARGET DIFF ===\n' + diff
          Path('/tmp/review-prompt.txt').write_text(prompt, encoding='utf-8')
          print('REVIEW_PACKAGE_CHARS', len(prompt))
          print('REVIEW_DIFF_LINES', diff.count('\n') + 1)
          PY

      - name: Install current Copilot CLI
        run: npm install -g @github/copilot

      - name: Run fresh read-only Copilot review
        working-directory: target
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat /tmp/review-prompt.txt | copilot -s --no-ask-user --no-custom-instructions --available-tools=read --allow-tool=read > /tmp/review-output.txt

      - name: Print and validate independent review
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          content = Path('/tmp/review-output.txt').read_text(encoding='utf-8')
          print('=== INDEPENDENT_REVIEW_BEGIN ===')
          print(content)
          print('=== INDEPENDENT_REVIEW_END ===')
          patterns = {
              'result': r'^REVIEW_RESULT:\s*(PASS|FAIL)\s*$',
              'critical': r'^CRITICAL:\s*(\d+)\s*$',
              'important': r'^IMPORTANT:\s*(\d+)\s*$',
              'minor': r'^MINOR:\s*(\d+)\s*$',
          }
          values = {}
          for key, pat in patterns.items():
              m = re.search(pat, content, re.M)
              if not m:
                  raise SystemExit(f'MALFORMED_REVIEW missing {key}')
              values[key] = m.group(1)
          coverage = re.findall(r'^-\s*(\d+):\s*(PASS|FINDING)\b', content, re.M)
          if [int(n) for n,_ in coverage] != list(range(1,19)):
              raise SystemExit(f'MALFORMED_REVIEW challenge coverage={coverage}')
          print('REVIEW_PARSED', values)
          critical = int(values['critical'])
          important = int(values['important'])
          if values['result'] == 'PASS' and (critical or important):
              raise SystemExit('INVALID_REVIEW PASS with blocking findings')
          if values['result'] == 'FAIL' and not (critical or important):
              raise SystemExit('INVALID_REVIEW FAIL without Critical/Important findings')
          PY
