name: Task057 historical truth repair

on:
  push:
    paths:
      - .github/workflows/task057-history-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact historical lines and verify bounded diff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/PROJECT-TASKS.md')
          data = p.read_bytes()

          old1 = b"- **Execution Note:** isolated worktree was prepared but host Active Workspace mutation routing blocked writes there; implementation continued inline on local `main` under the user's explicit continuous approval. Remote publication was performed only after the user's separate explicit push approval."
          new1 = b"- **Execution Note:** isolated worktree was prepared but host Active Workspace mutation routing blocked writes/commits there; implementation continued inline on local `main` under the user's explicit continuous approval. Remote publication was performed only after the user's separate explicit push approval."
          old2 = b"- **Final Candidate:** `089fc186275b303440b3fe236c5e29b39f552cd5`"
          new2 = b"- **Final Candidate:** `089fc186275b303440b3be236c5e29b39f552cd5`"

          assert data.count(old1) == 1, f'TASK-022 wrong-line count={data.count(old1)}'
          assert data.count(old2) == 1, f'TASK-032 wrong-line count={data.count(old2)}'
          data = data.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_bytes(data)
          PY

          rm .github/workflows/task057-history-repair.yml
          git diff --check

          python - <<'PY'
          import subprocess
          baseline = '4a5eb8b83fcd432bbc9f3c4be819d8936379c0f5'
          path = 'docs/superpowers/PROJECT-TASKS.md'
          diff = subprocess.check_output(['git', 'diff', baseline, '--', path], text=True)
          hunks = [line for line in diff.splitlines() if line.startswith('@@')]
          assert len(hunks) == 2, f'expected 2 hunks, got {len(hunks)}\n{diff}'
          assert '- Current backlog: none (`TODO=0`, `IN_PROGRESS=0`, `BLOCKED=0`).' in diff
          assert '+- Current backlog: `TASK-057 IN_PROGRESS` (`TODO=0`, `IN_PROGRESS=1`, `BLOCKED=0`).' in diff
          assert '+## Task #57 — ProjectFramework 1.19 AI-ControlTower Governance Support Layer' in diff
          assert 'blocked writes there' not in diff
          assert '089fc186275b303440b3fe236c5e29b39f552cd5' not in diff
          print(diff)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(task057): restore exact historical task truth'
          git push origin HEAD:main
