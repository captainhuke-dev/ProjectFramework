name: TASK-057 planner execution handoff

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded planner handoff patch
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          echo "$PATCH_B64" | base64 -d > /tmp/task057_patch.py
          git merge-base --is-ancestor "efba94321ece4cbd520c9937c78e142f8a6d3c71" HEAD
          rm .github/workflows/task057-planner-handoff.yml
          python /tmp/task057_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(task057): enforce planner execution handoff boundary"
          git push origin HEAD:main
