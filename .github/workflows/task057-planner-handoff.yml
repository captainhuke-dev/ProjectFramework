name: TASK-057 planner execution handoff

on:
  push:
    branches:
      - main
    paths:
      - '.github/task057-planner-handoff.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded handoff patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/task057-planner-handoff.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/PROJECT-TASKS.md docs/superpowers/specs/2026-09-14-task057-ai-controltower-governance-support-layer-design.md docs/superpowers/plans/2026-09-14-task057-ai-controltower-governance-support-layer.md
          git commit -m 'docs(task057): enforce planner execution handoff boundary'
          git push origin HEAD:main
