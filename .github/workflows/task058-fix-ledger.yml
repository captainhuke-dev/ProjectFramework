name: TASK058 temporary ledger consistency fix

on:
  push:
    branches:
      - task058-framework120
    paths:
      - .github/workflows/task058-fix-ledger.yml

permissions:
  contents: write

jobs:
  fix-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task058-framework120
          fetch-depth: 0
      - name: Fix exact backlog summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/PROJECT-TASKS.md')
          text = p.read_text(encoding='utf-8')
          old = '- Current backlog: `TODO=1 / IN_PROGRESS=0 / BLOCKED=0` (TASK-058 TODO).'
          new = '- Current backlog: `TODO=0 / IN_PROGRESS=1 / BLOCKED=0` (TASK-058 IN_PROGRESS).'
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Commit ledger fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/PROJECT-TASKS.md
          git commit -m "fix(task058): align durable backlog lifecycle [skip ci]"
          git push origin HEAD:task058-framework120
