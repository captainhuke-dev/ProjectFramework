name: TASK058 temporary event-order normative patch

on:
  push:
    branches:
      - task058-framework120
    paths:
      - .github/workflows/task058-event-order-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task058-framework120
          fetch-depth: 0
      - name: Apply and verify exact event-order patch
        run: |
          python docs/superpowers/tools/task058_event_order_fix.py
          git diff --check
      - name: Commit and push normative event-order fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Framework-Source/references/core-governance-rules.md Framework-Source/references/framework-governance-amendment-260916-task058-deterministic-execution-runtime-contract.md
          git commit -m "fix(task058): govern duplicate and out-of-order runtime events [skip ci]"
          git push origin HEAD:task058-framework120
