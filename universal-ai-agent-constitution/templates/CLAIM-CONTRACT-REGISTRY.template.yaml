schema_version: '1.0'
project_id: <project-id>
registry_id: <stable id>
contracts:
- token: COVERAGE_COMPLETE
  meaning: required reading scope was fully received
  issuer_scope:
  - reader
  substantiating_artifact: coverage_receipt
  validation_method: ARTIFACT_INSPECTION
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_SOURCE_RECORD
  - EVIDENCE_PROCESS_RECEIPT
  freshness_or_expiry: per source identity
  safe_fallback: COVERAGE_UNKNOWN
  controls:
  - governance-dependent conclusion
- token: HANDOFF_ACCEPTED
  meaning: receiver verified and accepted state transfer
  issuer_scope:
  - receiver
  substantiating_artifact: receiver_handoff_receipt
  validation_method: ARTIFACT_INSPECTION
  admissible_evidence_classes:
  - EVIDENCE_PROCESS_RECEIPT
  - EVIDENCE_TOOL_OBSERVATION
  freshness_or_expiry: per continuation epoch
  safe_fallback: HANDOFF_UNVERIFIED
  controls:
  - continuation
- token: HANDOFF_INVALID
  meaning: receiver found a transfer mismatch
  issuer_scope:
  - receiver
  substantiating_artifact: handoff_mismatch_report
  validation_method: ARTIFACT_INSPECTION
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_SOURCE_RECORD
  freshness_or_expiry: per handoff identity
  safe_fallback: HANDOFF_UNVERIFIED
  controls:
  - stop affected continuation
- token: CONTEXT_BINDING_MATCH
  meaning: agents use the same declared context binding
  issuer_scope:
  - boot
  - receiver
  substantiating_artifact: context_binding_comparison
  validation_method: MACHINE_TEST
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_PROCESS_RECEIPT
  freshness_or_expiry: per session/attempt
  safe_fallback: CONTEXT_BINDING_UNKNOWN
  controls:
  - shared-context claim
- token: VERIFIED
  meaning: claim or artifact passed its verification contract
  issuer_scope:
  - authorized verifier
  substantiating_artifact: verification_receipt
  validation_method: PROJECT_DEFINED
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_SOURCE_RECORD
  - EVIDENCE_PROCESS_RECEIPT
  - EVIDENCE_HUMAN_DECISION
  freshness_or_expiry: claim-specific
  safe_fallback: UNVERIFIED
  controls:
  - acceptance/publication where required
- token: PUBLISHED
  meaning: exact artifact is readable at the declared external locator
  issuer_scope:
  - publisher/verifier
  substantiating_artifact: remote_readback_receipt
  validation_method: RUNTIME_OBSERVATION
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_PROCESS_RECEIPT
  freshness_or_expiry: per publication identity
  safe_fallback: PUBLICATION_UNVERIFIED
  controls:
  - publication completion
- token: CLOSED
  meaning: durable terminal accounting exists
  issuer_scope:
  - closure authority/process
  substantiating_artifact: closure_receipt
  validation_method: ARTIFACT_INSPECTION
  admissible_evidence_classes:
  - EVIDENCE_PROCESS_RECEIPT
  - EVIDENCE_SOURCE_RECORD
  freshness_or_expiry: terminal
  safe_fallback: NOT_CLOSED
  controls:
  - lineage completion
- token: POTENTIAL_APPLICABLE_CONSTRAINT
  meaning: credible external obligation requires applicability review
  issuer_scope:
  - any observer
  substantiating_artifact: constraint_candidate_assessment
  validation_method: HUMAN_REVIEW
  admissible_evidence_classes:
  - EVIDENCE_SOURCE_RECORD
  freshness_or_expiry: until verified/rejected
  safe_fallback: CONSTRAINT_STATUS_UNKNOWN
  controls:
  - affected-action hold when material
- token: STATE_AUTHORITY_MAP_VALID
  meaning: one canonical authority is declared per state class
  issuer_scope:
  - validator
  substantiating_artifact: state_map_validation_receipt
  validation_method: MACHINE_TEST
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_PROCESS_RECEIPT
  freshness_or_expiry: per map version
  safe_fallback: STATE_AUTHORITY_UNKNOWN
  controls:
  - multi-agent continuation
- token: PROJECT_BINDING_MATCH
  meaning: Project root, ID, repository/ref policy and front door agree.
  issuer_scope:
  - authorized validator or verifier
  substantiating_artifact: governance/PROJECT-BINDING.yaml
  validation_method: IDENTITY_COMPARISON
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_SOURCE_RECORD
  - EVIDENCE_PROCESS_RECEIPT
  freshness_or_expiry: invalidated by a material referenced identity or access change
  safe_fallback: PROJECT_BINDING_UNKNOWN
  controls:
  - material Project work
- token: TASK_CONTEXT_CURRENT
  meaning: Attempt preconditions match current canonical identities immediately before
    material write.
  issuer_scope:
  - authorized validator or verifier
  substantiating_artifact: governance/BOOT-RECEIPT.yaml
  validation_method: PRE_WRITE_COMPARISON
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_SOURCE_RECORD
  - EVIDENCE_PROCESS_RECEIPT
  freshness_or_expiry: invalidated by a material referenced identity or access change
  safe_fallback: TASK_CONTEXT_UNKNOWN
  controls:
  - material write/commit/push/merge/state transition
- token: CANONICAL_SURFACE_VISIBLE
  meaning: Intended receiver can read back the canonical surface and exact identity.
  issuer_scope:
  - authorized validator or verifier
  substantiating_artifact: governance/INSTALLATION-VALIDATION.yaml
  validation_method: RECEIVER_READBACK
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_SOURCE_RECORD
  - EVIDENCE_PROCESS_RECEIPT
  freshness_or_expiry: invalidated by a material referenced identity or access change
  safe_fallback: CANONICAL_SURFACE_VISIBILITY_UNKNOWN
  controls:
  - cross-agent handoff/continuation
- token: PLATFORM_ADAPTER_INVOKED
  meaning: Platform adapter invoked Bootstrap Kernel/UAAC-BOOT at required trigger.
  issuer_scope:
  - authorized validator or verifier
  substantiating_artifact: governance/AGENT-ADAPTER-REGISTRY.yaml
  validation_method: BEHAVIORAL_INVOCATION_TEST
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_SOURCE_RECORD
  - EVIDENCE_PROCESS_RECEIPT
  freshness_or_expiry: invalidated by a material referenced identity or access change
  safe_fallback: PLATFORM_ADAPTER_UNVERIFIED
  controls:
  - Auto-Boot installation status
- token: AUTO_BOOT_VALID
  meaning: Auto-Boot resolves canonical state and selects applicable procedures without
    a user reminder.
  issuer_scope:
  - authorized validator or verifier
  substantiating_artifact: governance/BOOT-RECEIPT.yaml
  validation_method: BEHAVIORAL_SCENARIO
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_SOURCE_RECORD
  - EVIDENCE_PROCESS_RECEIPT
  freshness_or_expiry: invalidated by a material referenced identity or access change
  safe_fallback: AUTO_BOOT_UNVERIFIED
  controls:
  - ordinary material tasks
- token: BASE_FRESHNESS_MATCH
  meaning: Publication base and expected predecessor remain current at ref update.
  issuer_scope:
  - authorized validator or verifier
  substantiating_artifact: PUBLICATION-CONTRACT.yaml
  validation_method: BASE_AND_REF_RECHECK
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_SOURCE_RECORD
  - EVIDENCE_PROCESS_RECEIPT
  freshness_or_expiry: invalidated by a material referenced identity or access change
  safe_fallback: BASE_FRESHNESS_UNKNOWN
  controls:
  - publication
- token: ATOMIC_PUBLICATION_VERIFIED
  meaning: Exact final tree is visible remotely with no partial/staging artifacts.
  issuer_scope:
  - authorized validator or verifier
  substantiating_artifact: PUBLICATION-CONTRACT.yaml
  validation_method: REMOTE_TREE_READBACK
  admissible_evidence_classes:
  - EVIDENCE_TOOL_OBSERVATION
  - EVIDENCE_SOURCE_RECORD
  - EVIDENCE_PROCESS_RECEIPT
  freshness_or_expiry: invalidated by a material referenced identity or access change
  safe_fallback: PUBLICATION_UNVERIFIED
  controls:
  - PUBLISHED claim
