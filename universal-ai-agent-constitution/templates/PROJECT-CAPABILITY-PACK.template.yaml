schema_version: '1.0'
document_type: PROJECT_CAPABILITY_PACK
pack_id: <id>
project_id: <project-id>
status: BLOCKED
profile:
  multi_session: true
  multi_agent: true
  decision_support: true
  human_facing_transformation: true
required_functional_outcomes:
- BOOT
- REPORT
- RECALL
- CHECKPOINT
- HANDOFF
- DECISION
- COMMUNICATION
procedure_registry:
  locator: governance/SKILL-REGISTRY.yaml
project_document_registry:
  locator: governance/PROJECT-DOCUMENT-REGISTRY.yaml
extensions: []
context_substrates: []
resolved_at: <timestamp>
resolved_by: <authorized-identity>
approval_ref: <authority-ref>
auto_boot:
  status: BLOCKED
  trigger: EVERY_MATERIAL_TASK
  procedure_id: UAAC-BOOT
  automatic_skill_selection: true
  user_restatement_required: false
  freshness_policy: IDENTITY_AND_TRIGGER_BASED
